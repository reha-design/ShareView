version: '3'

services:
  shareview:
    build: .
    image: shareview-local
    container_name: shareview-container
    ports:
      - "3000:3000" # Web Server
      - "9000:9000" # PeerJS Signaling Server
    restart: unless-stopped
    # 필요하다면 환경 변수 추가
